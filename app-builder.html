<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>App Builder — Compose an App from Existing Objects</title>
  <link rel="stylesheet" href="falcon-tokens.css">
  <style>
    /* ═══════════════════════════════════════════════════════════════════
       APP BUILDER
       Flow: Build entry (rail, bottom-left) -> apps index -> name the app
             -> builder (Build | Settings) -> publish -> end-user app.

       The builder is STRUCTURAL, not conversational: there is no AI chat
       panel. The user composes a nav out of objects that already exist in
       the workspace. Sections are groups; objects are rows.

       Chrome + tokens lifted from builder-mvp.html so the two prototypes
       are visually the same product. Geometry off Figma frame 5:12893.
       ═══════════════════════════════════════════════════════════════════ */

    body { overflow: hidden; }

    /* ══════════════════════════════════════════════════════════════════
       PROTOTYPE NAV — deliberately NOT Asana chrome, so nobody mistakes
       it for product UI in a review.
       ══════════════════════════════════════════════════════════════════ */
    .proto-nav {
      height: 44px; flex-shrink: 0;
      display: flex; align-items: center; gap: var(--spacing-16);
      padding: 0 var(--spacing-16);
      background: var(--inverse-background-strong);
      color: var(--inverse-text);
    }
    .proto-nav__brand {
      display: inline-flex; align-items: center; gap: var(--spacing-8);
      font-size: var(--type-s-size); letter-spacing: 0.04em;
      text-transform: uppercase; font-weight: 700;
      color: rgba(242,243,244,0.6); white-space: nowrap;
    }
    /* Step trail — shows where you are in the flow */
    .proto-steps { display: inline-flex; align-items: center; gap: 2px; }
    .proto-step {
      height: 26px; padding: 0 10px;
      display: inline-flex; align-items: center; gap: 6px;
      border: none; border-radius: 6px; background: none;
      color: rgba(242,243,244,0.5);
      font-family: inherit; font-size: var(--type-s-size);
      letter-spacing: 0; cursor: pointer; white-space: nowrap;
      transition: background 120ms ease, color 120ms ease;
    }
    .proto-step:hover:not(:disabled) { background: rgba(255,255,255,0.12); color: #fff; }
    .proto-step:disabled { cursor: default; opacity: 0.45; }
    .proto-step--done { color: rgba(242,243,244,0.8); }
    .proto-step--active { background: var(--background-weak); color: var(--text); font-weight: 500; }
    .proto-step__n {
      width: 16px; height: 16px; border-radius: 500px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 700;
      background: rgba(255,255,255,0.18); color: inherit;
    }
    .proto-step--active .proto-step__n { background: var(--text); color: #fff; }
    .proto-nav__sep { color: rgba(242,243,244,0.25); font-size: 11px; }
    .proto-nav__reset {
      margin-left: auto;
      height: 26px; padding: 0 10px;
      background: none; border: 1px solid rgba(255,255,255,0.22);
      border-radius: 6px; color: rgba(242,243,244,0.85);
      font-family: inherit; font-size: var(--type-s-size);
      letter-spacing: 0; cursor: pointer; white-space: nowrap;
    }
    .proto-nav__reset:hover { background: rgba(255,255,255,0.12); color: #fff; }

    .page { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ── Asana shell ─────────────────────────────────────────────────── */
    .app {
      flex: 1; min-height: 0;
      display: grid; grid-template-rows: var(--topbar-height) 1fr;
      background: var(--background-medium);
      overflow: hidden;
    }
    .app__lower {
      display: grid;
      grid-template-columns: var(--rail-width) var(--sidebar-width) 1fr;
      min-height: 0;
    }

    /* ── Topbar ──────────────────────────────────────────────────────── */
    .topbar {
      display: flex; align-items: center; gap: var(--spacing-8);
      padding: 0 var(--spacing-12);
      background: var(--background-medium);
    }
    .topbar__left  { flex: 1; display: flex; align-items: center; gap: var(--spacing-8); }
    .topbar__right { flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: var(--spacing-4); }
    .create-btn {
      display: inline-flex; align-items: center; gap: 6px;
      height: 28px; padding: 0 12px 0 8px;
      background: var(--button-creation-background);
      color: var(--button-creation-icon);
      border: none; border-radius: 500px;
      font-family: inherit; font-size: var(--type-m-size);
      line-height: var(--type-m-line); letter-spacing: var(--type-m-track);
      font-weight: 500; cursor: pointer; transition: filter 120ms ease;
    }
    .create-btn:hover { filter: brightness(0.95); }
    .create-btn svg { width: 14px; height: 14px; }
    .search {
      width: 540px; flex-shrink: 0;
      display: flex; align-items: center; gap: var(--spacing-8);
      height: 28px; padding: 0 12px;
      background: var(--background-weak);
      border: 1px solid var(--border-strong);
      border-radius: 500px; color: var(--text-weak);
      font-size: var(--type-m-size); letter-spacing: var(--type-m-track);
    }
    .search svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--icon); }

    /* ── Icon rail ───────────────────────────────────────────────────── */
    .rail {
      display: flex; flex-direction: column;
      justify-content: space-between; align-items: stretch;
      background: var(--background-medium); overflow: hidden;
    }
    .rail__modes { display: flex; flex-direction: column; gap: var(--spacing-4); }
    .rail__mode {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: var(--spacing-4); padding: 6px var(--spacing-4) 2px;
      border-radius: 6px; cursor: pointer;
      background: none; border: none; width: 100%; font-family: inherit;
    }
    .rail__mode-icon {
      display: inline-flex; align-items: center; justify-content: center;
      padding: var(--spacing-8); border-radius: 6px;
      color: var(--icon); transition: background 120ms ease;
    }
    .rail__mode:hover .rail__mode-icon { background: var(--background-hover); }
    .rail__mode-label {
      font-family: var(--font-text);
      font-size: var(--type-rail-size); font-weight: 500;
      color: var(--text-weak); text-align: center; line-height: normal;
    }
    .rail__mode--active .rail__mode-icon { background: var(--background-active); color: var(--icon-active); }
    .rail__mode--active .rail__mode-label { color: var(--text); }

    .rail__actions {
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      gap: var(--spacing-12); padding: 10px 0 18px;
    }
    /* THE BUILD ENTRY — bottom-left corner of the navigation. Divider above
       separates it from the workspace modes: it is a tool, not a place. */
    .rail__build {
      width: 100%; padding-top: var(--spacing-12);
      border-top: 1px solid var(--border-strong);
      display: flex; justify-content: center;
    }
    .rail__mode--build .rail__mode-icon { color: var(--icon); }
    .rail__mode--build:hover .rail__mode-icon { background: var(--background-active); color: var(--icon-active); }
    /* Nudge — a soft pulse so reviewers find the entry point unaided */
    .rail__mode--nudge .rail__mode-icon {
      animation: buildPulse 2.4s ease-in-out infinite;
      box-shadow: 0 0 0 0 rgba(69,115,210,0.5);
    }
    @keyframes buildPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(69,115,210,0.42); }
      50%      { box-shadow: 0 0 0 6px rgba(69,115,210,0); }
    }

    .avatar-28 {
      width: var(--sizing-28); height: var(--sizing-28); border-radius: 500px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--cz-yellow-bg); color: var(--cz-yellow-fg);
      border: 1px solid var(--avatar-hairline);
      font-size: var(--type-s-size); line-height: var(--type-s-line);
      flex-shrink: 0;
    }

    /* ── Sidebar ─────────────────────────────────────────────────────── */
    .sidebar {
      position: relative;
      display: flex; flex-direction: column; align-items: stretch;
      padding: var(--spacing-4) 0;
      background: var(--background-medium);
      border: 1px solid var(--border-strong); border-bottom: none;
      border-top-left-radius: var(--spacing-8);
      overflow: hidden;
    }
    .sb__section {
      display: flex; align-items: flex-end;
      height: 30px; padding: 0 var(--spacing-12) var(--spacing-8);
      font-size: var(--type-s-size); line-height: var(--type-s-line);
      font-weight: 500; color: var(--text-weak);
    }
    .sb__group { display: flex; flex-direction: column; padding: 0 var(--spacing-4); }
    .sb__row {
      display: flex; align-items: center; gap: var(--spacing-8);
      height: 32px; padding: 1px var(--spacing-8);
      border-radius: var(--spacing-8); cursor: pointer; color: var(--text);
      font-size: var(--type-m-size); line-height: var(--type-m-line);
      letter-spacing: var(--type-m-track);
      transition: background 120ms ease;
    }
    .sb__row:hover { background: var(--background-hover); }
    .sb__row--active { background: var(--background-active); }
    .sb__row-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sb__row-count { font-size: var(--type-s-size); color: var(--text-weak); }

    /* ── Icon boxes — real Asana glyphs are filled paths, often smaller
       than their nominal box. Wrapper holds the box; svg keeps its leaf. */
    .ico { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--icon); }
    .ico--16 { width: 16px; height: 16px; }
    .ico--14 { width: 14px; height: 14px; }
    .ico--12 { width: 12px; height: 12px; }
    .ico > svg { display: block; }

    /* ── Buttons ─────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 32px; padding: 0 14px;
      border-radius: 6px; cursor: pointer; font-family: inherit;
      font-size: var(--type-m-size); line-height: var(--type-m-line);
      letter-spacing: var(--type-m-track); font-weight: 500;
      transition: background 120ms ease, filter 120ms ease;
      white-space: nowrap;
    }
    .btn > svg { width: 14px; height: 14px; }
    .btn--primary {
      background: var(--primary-background-strong); color: var(--primary-text-strong);
      border: 1px solid var(--primary-background-strong);
    }
    .btn--primary:hover { filter: brightness(0.94); }
    .btn--primary:disabled { background: var(--background-strong); border-color: var(--border-strong); color: var(--text-disabled); cursor: default; filter: none; }
    .btn--secondary {
      background: var(--button-background-secondary); color: var(--text);
      border: 1px solid var(--button-border-secondary);
    }
    .btn--secondary:hover { background: var(--background-medium); }
    .btn--subtle {
      background: none; border: 1px solid transparent; color: var(--text-weak);
    }
    .btn--subtle:hover { background: var(--background-hover); color: var(--text); }
    .btn--sm { height: 28px; padding: 0 10px; font-size: var(--type-s-size); letter-spacing: 0; }

    .icon-btn {
      width: var(--sizing-28); height: var(--sizing-28);
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--button-background-subtle);
      border: 1px solid var(--button-border-subtle);
      border-radius: 6px; color: var(--icon); cursor: pointer;
      transition: background 120ms ease, color 120ms ease; flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--background-hover); color: var(--icon-active); }
    .icon-btn > svg { width: 16px; height: 16px; }
    .icon-btn--sm { width: 20px; height: 20px; border-radius: 4px; }
    .icon-btn--sm > svg { width: 12px; height: 12px; }

    /* ── Canvas ──────────────────────────────────────────────────────── */
    .canvas {
      display: flex; flex-direction: column; min-width: 0; min-height: 0;
      background: var(--background-weak);
      border-top: 1px solid var(--border-strong);
      border-left: 1px solid var(--border-strong);
      border-top-left-radius: var(--spacing-8);
      overflow: hidden; position: relative;
    }
    .cv__head {
      display: flex; flex-direction: column; justify-content: center; gap: 2px;
      padding: var(--spacing-24) var(--spacing-24) var(--spacing-12);
      flex-shrink: 0;
    }
    .cv__title-row { display: flex; align-items: center; gap: var(--spacing-8); }
    .cv__title {
      font-family: var(--font-display);
      font-size: var(--type-h3-size); line-height: var(--type-h3-line);
      letter-spacing: var(--type-h3-track); font-weight: 500; color: var(--text);
    }
    .cv__sub { font-size: var(--type-m-size); color: var(--text-weak); letter-spacing: var(--type-m-track); }
    .cv__head-actions { margin-left: auto; display: flex; align-items: center; gap: var(--spacing-8); }
    .cv__body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 var(--spacing-24) var(--spacing-24); }

    /* Object-type squircle avatar, colored per type */
    .obj-av {
      width: var(--sizing-24); height: var(--sizing-24); flex-shrink: 0;
      border-radius: 6px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .obj-av--sm { width: 20px; height: 20px; border-radius: 5px; }
    .obj-av--lg { width: var(--sizing-36); height: var(--sizing-36); border-radius: 8px; }
    .obj-av svg { display: block; }

    /* ══════════════════════════════════════════════════════════════════
       APPS INDEX
       ══════════════════════════════════════════════════════════════════ */
    .apps-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr));
      gap: var(--spacing-12);
    }
    .app-card {
      display: flex; flex-direction: column; gap: var(--spacing-8);
      padding: var(--spacing-16);
      border: 1px solid var(--border); border-radius: var(--spacing-8);
      background: var(--background-weak); cursor: pointer;
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }
    .app-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-medium); }
    .app-card__top { display: flex; align-items: center; gap: var(--spacing-8); }
    .app-card__name { font-weight: 500; color: var(--text); }
    .app-card__meta { font-size: var(--type-s-size); color: var(--text-weak); }
    .app-card__foot { display: flex; align-items: center; gap: 6px; margin-top: var(--spacing-4); }
    .pill {
      display: inline-flex; align-items: center; gap: 4px;
      height: 20px; padding: 0 8px; border-radius: 500px;
      font-size: var(--type-s-size); letter-spacing: 0; white-space: nowrap;
    }
    .pill--live  { background: var(--cz-green-bg);  color: var(--cz-green-fg); }
    .pill--draft { background: var(--cz-none-bg);   color: var(--cz-none-fg); }
    .pill--new   { background: var(--cz-blue-bg);   color: var(--cz-blue-fg); }

    .app-card--new {
      align-items: center; justify-content: center; text-align: center;
      border-style: dashed; border-color: var(--border-strong);
      background: var(--background-weak); min-height: 128px; gap: var(--spacing-4);
    }
    .app-card--new:hover { border-color: var(--primary-background-strong); background: var(--selected-background); }
    .app-card--new .obj-av { background: var(--selected-background); color: var(--primary-background-strong); }
    .app-card--new__label { font-weight: 500; color: var(--text); }

    /* ══════════════════════════════════════════════════════════════════
       MODAL — name the app
       ══════════════════════════════════════════════════════════════════ */
    .scrim {
      position: fixed; inset: 0; z-index: 60;
      background: rgba(29,31,33,0.32);
      display: none; align-items: center; justify-content: center;
    }
    .scrim--on { display: flex; }
    .modal {
      width: 468px; background: var(--background-weak);
      border-radius: var(--spacing-12); box-shadow: var(--shadow-large);
      overflow: hidden;
    }
    .modal__head {
      display: flex; align-items: center; gap: var(--spacing-8);
      padding: var(--spacing-16) var(--spacing-24);
      border-bottom: 1px solid var(--border);
    }
    .modal__title {
      font-family: var(--font-display); font-size: var(--type-xl-size);
      line-height: var(--type-xl-line); letter-spacing: var(--type-xl-track);
      font-weight: 500;
    }
    .modal__body { padding: var(--spacing-24); display: flex; flex-direction: column; gap: var(--spacing-16); }
    .modal__foot {
      display: flex; align-items: center; justify-content: flex-end; gap: var(--spacing-8);
      padding: var(--spacing-12) var(--spacing-24); border-top: 1px solid var(--border);
      background: var(--background-weak);
    }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field__label { font-size: var(--type-s-size); font-weight: 500; color: var(--text); }
    .field__hint  { font-size: var(--type-s-size); color: var(--text-weak); }
    .input {
      height: 36px; padding: 0 12px;
      border: 1px solid var(--border-strong); border-radius: 6px;
      background: var(--background-weak); color: var(--text);
      font-family: inherit; font-size: var(--type-m-size);
      letter-spacing: var(--type-m-track); width: 100%;
    }
    .input:focus { outline: none; border-color: var(--selected-border); box-shadow: 0 0 0 2px var(--selected-background); }
    .input::placeholder { color: var(--text-disabled); }

    /* Icon + color picker */
    .swatches { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .swatch {
      width: var(--sizing-28); height: var(--sizing-28); border-radius: 6px;
      border: 2px solid transparent; cursor: pointer; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      transition: transform 100ms ease;
    }
    .swatch:hover { transform: scale(1.08); }
    .swatch--on { border-color: var(--text); }
    .glyphs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .glyph {
      width: var(--sizing-28); height: var(--sizing-28); border-radius: 6px;
      border: 1px solid var(--border-strong); background: var(--background-weak);
      cursor: pointer; color: var(--icon);
      display: inline-flex; align-items: center; justify-content: center;
    }
    .glyph:hover { background: var(--background-medium); }
    .glyph--on { border-color: var(--selected-border); background: var(--selected-background); color: var(--selected-text); }

    /* ══════════════════════════════════════════════════════════════════
       BUILDER — full-screen overlay. Build | Settings.
       ══════════════════════════════════════════════════════════════════ */
    .builder {
      position: fixed; inset: 0; z-index: 50;
      background: var(--background-medium);
      display: none; flex-direction: column;
    }
    .builder--on { display: flex; }
    /* White header, 56px — matches .builder__head in builder-mvp */
    .bld__topbar {
      position: relative;
      height: 56px; flex-shrink: 0;
      display: flex; align-items: center; gap: var(--spacing-12);
      padding: 0 var(--spacing-16);
      background: var(--background-weak);
      border-bottom: 1px solid var(--border);
    }
    .bld__id { display: flex; align-items: center; gap: var(--spacing-8); min-width: 0; }
    .bld__name {
      font-weight: 500; color: var(--text); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; max-width: 260px;
    }
    .bld__badge {
      font-size: var(--type-s-size); letter-spacing: 0;
      color: var(--text-weak); padding: 0 6px; height: 18px;
      display: inline-flex; align-items: center;
      background: var(--background-strong); border-radius: 4px;
    }
    /* Build | Settings segmented control, centred.
       Lifted verbatim from builder-mvp's .segmented so the two prototypes
       share one component rather than two lookalikes. No leading icons. */
    .segmented {
      position: absolute; left: 50%; transform: translateX(-50%);
      display: inline-flex; gap: 2px; padding: 2px;
      background: var(--background-medium); border-radius: 6px;
    }
    .segmented__btn {
      height: 24px; padding: 0 var(--spacing-12);
      border: none; background: none; border-radius: 5px;
      font-family: inherit; font-size: var(--type-s-size);
      letter-spacing: 0; color: var(--text-weak); cursor: pointer;
    }
    .segmented__btn:hover { color: var(--text); }
    .segmented__btn--active {
      background: var(--background-weak); color: var(--text);
      font-weight: 500; box-shadow: var(--shadow-medium);
    }
    .bld__actions { margin-left: auto; display: flex; align-items: center; gap: var(--spacing-8); }

    .bld__panes { flex: 1; min-height: 0; position: relative; }
    .bld__pane { position: absolute; inset: 0; display: none; }
    .bld__pane--on { display: flex; }

    /* Build pane = a live preview of the app shell the user is composing */
    .bld__stage {
      flex: 1; min-width: 0; min-height: 0;
      padding: var(--spacing-24);
      display: flex; flex-direction: column; gap: var(--spacing-12);
      overflow: hidden;
    }
    .bld__stage-bar {
      display: flex; align-items: center; gap: var(--spacing-8);
      flex-shrink: 0;
    }
    .bld__stage-label { font-size: var(--type-s-size); font-weight: 500; color: var(--text-weak); }
    .bld__stage-hint { font-size: var(--type-s-size); color: var(--text-weak); margin-left: auto; }

    /* The framed preview — a real Asana shell, scaled to fit the stage */
    .preview {
      flex: 1; min-height: 0;
      display: grid; grid-template-rows: var(--topbar-height) 1fr;
      background: var(--background-medium);
      border: 1px solid var(--border-strong);
      border-radius: var(--spacing-12);
      overflow: hidden;
      box-shadow: var(--shadow-large);
    }
    .preview__lower {
      display: grid; grid-template-columns: var(--rail-width) 208px 1fr;
      min-height: 0;
    }
    /* Inside the preview the composed sidebar is editable */
    .preview .sidebar { border-top-left-radius: var(--spacing-8); }
    .preview .canvas  { border-top-left-radius: var(--spacing-8); }

    /* ── Editable sections in the preview sidebar ────────────────────── */
    .sec { display: flex; flex-direction: column; }
    .sec__head {
      display: flex; align-items: center; gap: 4px;
      height: 28px; padding: 0 var(--spacing-8) 0 var(--spacing-12);
      margin-top: var(--spacing-8);
    }
    .sec__name {
      flex: 1; min-width: 0;
      font-size: var(--type-s-size); line-height: var(--type-s-line);
      font-weight: 500; color: var(--text-weak);
      border: 1px solid transparent; border-radius: 4px;
      background: none; font-family: inherit; padding: 0 2px;
      letter-spacing: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .sec__name:hover { border-color: var(--border-strong); }
    .sec__name:focus { outline: none; border-color: var(--selected-border); background: var(--background-weak); color: var(--text); }
    .sec__tools { display: flex; align-items: center; gap: 2px; opacity: 0; transition: opacity 120ms ease; }
    .sec:hover .sec__tools { opacity: 1; }
    .sec__items { display: flex; flex-direction: column; padding: 0 var(--spacing-4); gap: 1px; }

    .sec__item {
      display: flex; align-items: center; gap: 6px;
      height: 30px; padding: 0 6px; border-radius: 6px;
      font-size: var(--type-m-size); letter-spacing: var(--type-m-track);
      color: var(--text); cursor: grab; position: relative;
    }
    .sec__item:hover { background: var(--background-hover); }
    .sec__item--sel { background: var(--background-active); }
    .sec__item-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sec__item-x { opacity: 0; }
    .sec__item:hover .sec__item-x { opacity: 1; }
    .sec__item--drag { opacity: 0.4; }
    .sec__item--over { box-shadow: inset 0 2px 0 0 var(--primary-background-strong); }

    /* Add-object row inside a section */
    .sec__add {
      display: flex; align-items: center; gap: 6px;
      height: 28px; margin: 1px var(--spacing-4) 0;
      padding: 0 6px; border-radius: 6px;
      border: none; background: none; cursor: pointer;
      font-family: inherit; font-size: var(--type-s-size);
      letter-spacing: 0; color: var(--text-weak); width: calc(100% - var(--spacing-8));
    }
    .sec__add:hover { background: var(--background-hover); color: var(--text); }
    .sec__add svg { width: 12px; height: 12px; }

    /* Add-section button, pinned under the list */
    .sb__addsection {
      display: flex; align-items: center; gap: 6px;
      height: 32px; margin: var(--spacing-8) var(--spacing-8) 0;
      padding: 0 var(--spacing-8); border-radius: 6px;
      border: 1px dashed var(--border-strong); background: none;
      cursor: pointer; font-family: inherit;
      font-size: var(--type-m-size); letter-spacing: var(--type-m-track);
      color: var(--text-weak); width: calc(100% - var(--spacing-16));
    }
    .sb__addsection:hover { border-color: var(--primary-background-strong); color: var(--selected-text); background: var(--selected-background); }
    .sb__addsection svg { width: 12px; height: 12px; }

    /* Blank-state coach mark in the preview sidebar */
    .sb__blank {
      margin: var(--spacing-8); padding: var(--spacing-12);
      border-radius: var(--spacing-8);
      background: var(--background-weak);
      border: 1px solid var(--border);
      font-size: var(--type-s-size); color: var(--text-weak); line-height: 16px;
    }
    .sb__blank strong { color: var(--text); font-weight: 500; }

    /* ══════════════════════════════════════════════════════════════════
       TYPEAHEAD — pick an existing object
       ══════════════════════════════════════════════════════════════════ */
    .ta {
      position: fixed; z-index: 70; width: 328px;
      background: var(--background-weak);
      border: 1px solid var(--border-strong);
      border-radius: var(--spacing-8);
      box-shadow: var(--shadow-large);
      display: none; flex-direction: column; overflow: hidden;
    }
    .ta--on { display: flex; }
    .ta__inputwrap {
      display: flex; align-items: center; gap: var(--spacing-8);
      padding: var(--spacing-8) var(--spacing-12);
      border-bottom: 1px solid var(--border);
    }
    .ta__inputwrap svg { width: 14px; height: 14px; color: var(--icon); flex-shrink: 0; }
    .ta__input {
      flex: 1; border: none; outline: none; background: none;
      font-family: inherit; font-size: var(--type-m-size);
      letter-spacing: var(--type-m-track); color: var(--text);
    }
    .ta__input::placeholder { color: var(--text-disabled); }
    .ta__list { max-height: 296px; overflow-y: auto; padding: var(--spacing-4); }
    .ta__group {
      padding: var(--spacing-8) var(--spacing-8) var(--spacing-4);
      font-size: var(--type-s-size); font-weight: 500; color: var(--text-weak);
      letter-spacing: 0;
    }
    .ta__opt {
      display: flex; align-items: center; gap: var(--spacing-8);
      padding: 6px var(--spacing-8); border-radius: 6px; cursor: pointer;
      font-size: var(--type-m-size); letter-spacing: var(--type-m-track);
    }
    .ta__opt:hover, .ta__opt--cursor { background: var(--background-hover); }
    .ta__opt--cursor { background: var(--selected-background); }
    .ta__opt-body { flex: 1; min-width: 0; }
    .ta__opt-name { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ta__opt-meta { font-size: var(--type-s-size); color: var(--text-weak); letter-spacing: 0; }
    .ta__opt-added { font-size: var(--type-s-size); color: var(--text-disabled); letter-spacing: 0; }
    .ta__opt--dis { opacity: 0.5; cursor: default; }
    .ta__opt--dis:hover { background: none; }
    .ta__empty { padding: var(--spacing-16) var(--spacing-12); font-size: var(--type-s-size); color: var(--text-weak); text-align: center; }
    .ta__foot {
      display: flex; align-items: center; gap: var(--spacing-8);
      padding: 6px var(--spacing-12);
      border-top: 1px solid var(--border);
      font-size: var(--type-s-size); color: var(--text-weak); letter-spacing: 0;
    }
    .kbd {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 16px; height: 16px; padding: 0 4px;
      border: 1px solid var(--border-strong); border-bottom-width: 2px;
      border-radius: 3px; background: var(--background-weak);
      font-size: 9px; color: var(--text-weak);
    }

    /* Highlighted match inside typeahead */
    .hl { background: var(--cz-yellow-bg); color: var(--cz-yellow-fg); border-radius: 2px; }

    /* ══════════════════════════════════════════════════════════════════
       SETTINGS PANE — access control
       ══════════════════════════════════════════════════════════════════ */
    .set {
      flex: 1; min-height: 0; overflow-y: auto;
      display: flex; justify-content: center;
      padding: var(--spacing-24);
    }
    .set__col { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: var(--spacing-24); }
    .set__card {
      background: var(--background-weak);
      border: 1px solid var(--border); border-radius: var(--spacing-12);
      overflow: hidden;
    }
    .set__cardhead {
      padding: var(--spacing-16) var(--spacing-16) var(--spacing-12);
      border-bottom: 1px solid var(--border);
    }
    .set__cardtitle { font-weight: 500; color: var(--text); }
    .set__cardsub { font-size: var(--type-s-size); color: var(--text-weak); margin-top: 2px; }

    .acc-row {
      display: flex; align-items: center; gap: var(--spacing-12);
      padding: var(--spacing-12) var(--spacing-16);
      border-bottom: 1px solid var(--border);
    }
    .acc-row:last-child { border-bottom: none; }
    .acc-row__body { flex: 1; min-width: 0; }
    .acc-row__name { color: var(--text); }
    .acc-row__meta { font-size: var(--type-s-size); color: var(--text-weak); }
    .avatar {
      width: var(--sizing-28); height: var(--sizing-28); border-radius: 500px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: var(--type-s-size); flex-shrink: 0;
      border: 1px solid var(--avatar-hairline);
    }
    .select {
      height: 28px; padding: 0 24px 0 8px;
      border: 1px solid var(--border-strong); border-radius: 6px;
      background: var(--background-weak) ; color: var(--text);
      font-family: inherit; font-size: var(--type-s-size); letter-spacing: 0;
      cursor: pointer; appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' fill='none' stroke='%23757677' stroke-width='1.4' stroke-linecap='round'/></svg>");
      background-repeat: no-repeat; background-position: right 7px center;
    }
    /* Radio-ish general access options */
    .opt-row {
      display: flex; align-items: flex-start; gap: var(--spacing-12);
      padding: var(--spacing-12) var(--spacing-16);
      border-bottom: 1px solid var(--border); cursor: pointer;
    }
    .opt-row:last-child { border-bottom: none; }
    .opt-row:hover { background: var(--background-hover); }
    .radio {
      width: 16px; height: 16px; border-radius: 500px; flex-shrink: 0;
      border: 1.5px solid var(--border-active); margin-top: 3px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .opt-row--on .radio { border-color: var(--primary-background-strong); }
    .opt-row--on .radio::after {
      content: ''; width: 8px; height: 8px; border-radius: 500px;
      background: var(--primary-background-strong);
    }
    .opt-row__title { color: var(--text); }
    .opt-row__sub { font-size: var(--type-s-size); color: var(--text-weak); margin-top: 1px; }

    .banner {
      display: flex; align-items: flex-start; gap: var(--spacing-8);
      padding: var(--spacing-12); border-radius: var(--spacing-8);
      background: var(--selected-background); color: var(--selected-text);
      font-size: var(--type-s-size); line-height: 18px;
    }
    .banner svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 2px; }

    /* ══════════════════════════════════════════════════════════════════
       CONTENT RENDERERS — what an object looks like once opened
       ══════════════════════════════════════════════════════════════════ */
    .empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: var(--spacing-8);
      padding: var(--spacing-24); text-align: center; color: var(--text-weak);
    }
    .empty__art {
      width: 56px; height: 56px; border-radius: var(--spacing-12);
      background: var(--background-strong); color: var(--icon);
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: var(--spacing-4);
    }
    .empty__art svg { width: 24px; height: 24px; }
    .empty__title { font-weight: 500; color: var(--text); font-size: var(--type-m-size); }
    .empty__sub { font-size: var(--type-s-size); max-width: 320px; line-height: 18px; }

    .tabs { display: flex; align-items: center; gap: var(--spacing-4); padding: 0 var(--spacing-24); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .tab {
      height: 36px; padding: 0 var(--spacing-8); border: none; background: none;
      color: var(--text-weak); cursor: pointer; font-family: inherit;
      font-size: var(--type-m-size); letter-spacing: var(--type-m-track);
      position: relative;
    }
    .tab--on { color: var(--text); font-weight: 500; }
    .tab--on::after {
      content: ''; position: absolute; left: var(--spacing-8); right: var(--spacing-8);
      bottom: -1px; height: 2px; background: var(--text); border-radius: 2px;
    }

    table.grid { width: 100%; border-collapse: collapse; }
    table.grid th {
      text-align: left; font-size: var(--type-s-size); font-weight: 500;
      color: var(--text-weak); padding: 0 var(--spacing-12);
      height: 32px; border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    table.grid td {
      padding: 0 var(--spacing-12); height: var(--row-height);
      border-bottom: 1px solid var(--border);
      font-size: var(--type-m-size); letter-spacing: var(--type-m-track);
      white-space: nowrap;
    }
    table.grid tr:last-child td { border-bottom: none; }
    table.grid td.num { font-variant-numeric: tabular-nums; }
    .grid-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--spacing-8); }

    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: var(--spacing-12); }
    .metric {
      padding: var(--spacing-16); border: 1px solid var(--border);
      border-radius: var(--spacing-8); background: var(--background-weak);
      display: flex; flex-direction: column; gap: 2px;
    }
    .metric__label { font-size: var(--type-s-size); color: var(--text-weak); text-transform: uppercase; letter-spacing: 0.04em; }
    .metric__value {
      font-family: var(--font-display); font-size: var(--type-h3-size);
      line-height: var(--type-h3-line); letter-spacing: var(--type-h3-track); font-weight: 500;
    }
    .metric__delta { font-size: var(--type-s-size); color: var(--text-weak); }
    .up   { color: #0e7a4a; }
    .down { color: #b4382e; }

    .tasklist { display: flex; flex-direction: column; }
    .task {
      display: flex; align-items: center; gap: var(--spacing-8);
      height: var(--row-height); border-bottom: 1px solid var(--border);
      font-size: var(--type-m-size); letter-spacing: var(--type-m-track);
    }
    .task:last-child { border-bottom: none; }
    .check {
      width: 16px; height: 16px; border-radius: 500px; flex-shrink: 0;
      border: 1.5px solid var(--border-strong);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; color: transparent;
    }
    .task--done .check { background: #0e7a4a; border-color: #0e7a4a; color: #fff; }
    .task--done .task__name { color: var(--text-weak); text-decoration: line-through; }
    .task__name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .task__meta { font-size: var(--type-s-size); color: var(--text-weak); }

    .doc { max-width: 680px; display: flex; flex-direction: column; gap: var(--spacing-12); }
    .doc h4 { font-size: var(--type-m-size); font-weight: 500; }
    .doc p  { font-size: var(--type-m-size); color: var(--text-weak); line-height: 22px; }
    .doc ul { padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
    .doc li { font-size: var(--type-m-size); color: var(--text-weak); }

    .people-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(212px, 1fr)); gap: var(--spacing-12); }
    .person {
      display: flex; align-items: center; gap: var(--spacing-8);
      padding: var(--spacing-12); border: 1px solid var(--border);
      border-radius: var(--spacing-8);
    }
    .person__name { font-size: var(--type-m-size); }
    .person__role { font-size: var(--type-s-size); color: var(--text-weak); }

    .status {
      display: inline-flex; align-items: center; height: 20px; padding: 0 8px;
      border-radius: 500px; font-size: var(--type-s-size); letter-spacing: 0;
    }

    /* Toast */
    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(12px);
      z-index: 90; display: flex; align-items: center; gap: var(--spacing-8);
      padding: 10px var(--spacing-16); border-radius: var(--spacing-8);
      background: var(--inverse-background-strong); color: var(--inverse-text);
      font-size: var(--type-m-size); letter-spacing: var(--type-m-track);
      box-shadow: var(--shadow-large);
      opacity: 0; pointer-events: none; transition: opacity 180ms ease, transform 180ms ease;
    }
    .toast--on { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast svg { width: 14px; height: 14px; color: var(--cz-green-bg); }

    @media (max-width: 1100px) {
      .search { width: 320px; }
    }
  </style>
</head>
<body>

<div class="proto-nav">
  <span class="proto-nav__brand">App Builder</span>
  <span class="proto-steps" id="steps"></span>
  <button class="proto-nav__reset" id="reset">Start over</button>
</div>

<div class="page">
  <div class="app">
    <div class="topbar">
      <div class="topbar__left">
        <button class="icon-btn" aria-label="Menu">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg>
        </button>
        <button class="create-btn">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg>
          Create
        </button>
      </div>
      <div class="search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6 14 14"/></svg>
        <span>Search</span>
      </div>
      <div class="topbar__right">
        <button class="icon-btn" aria-label="Help">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.2"/><path d="M6.2 6.2a1.9 1.9 0 1 1 2.7 1.7c-.5.3-.9.7-.9 1.3" stroke-linecap="round"/><circle cx="8" cy="11.4" r=".75" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
    </div>

    <div class="app__lower">
      <nav class="rail" id="rail" aria-label="Modes"></nav>
      <aside class="sidebar" id="sidebar"></aside>
      <main class="canvas" id="canvas"></main>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════
     BUILDER OVERLAY
     ═══════════════════════════════════════════════════════════════════ -->
<div class="builder" id="builder">
  <div class="bld__topbar">
    <div class="bld__id">
      <span class="obj-av obj-av--sm" id="bld-av"></span>
      <span class="bld__name" id="bld-name">Untitled app</span>
      <span class="bld__badge" id="bld-badge">Draft</span>
    </div>
    <div class="segmented">
      <button class="segmented__btn segmented__btn--active" data-bt="build">Build</button>
      <button class="segmented__btn" data-bt="settings">Settings</button>
    </div>
    <div class="bld__actions">
      <button class="btn btn--subtle btn--sm" id="bld-cancel">Cancel</button>
      <button class="btn btn--primary btn--sm" id="bld-publish" disabled>Publish app</button>
    </div>
  </div>

  <div class="bld__panes">
    <!-- BUILD -->
    <section class="bld__pane bld__pane--on" data-bp="build">
      <div class="bld__stage">
        <div class="bld__stage-bar">
          <span class="bld__stage-label">Preview</span>
          <span class="bld__stage-hint" id="bld-hint">Add a section, then add objects into it</span>
        </div>
        <div class="preview">
          <div class="topbar">
            <div class="topbar__left">
              <button class="icon-btn" aria-label="Menu">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg>
              </button>
              <button class="create-btn">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg>
                Create
              </button>
            </div>
            <div class="search">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6 14 14"/></svg>
              <span>Search</span>
            </div>
            <div class="topbar__right"><span class="avatar-28">TK</span></div>
          </div>
          <div class="preview__lower">
            <nav class="rail" id="pv-rail" aria-label="Modes"></nav>
            <aside class="sidebar" id="pv-sidebar"></aside>
            <main class="canvas" id="pv-canvas"></main>
          </div>
        </div>
      </div>
    </section>

    <!-- SETTINGS -->
    <section class="bld__pane" data-bp="settings">
      <div class="set"><div class="set__col" id="set-col"></div></div>
    </section>
  </div>
</div>

<!-- Name modal -->
<div class="scrim" id="scrim">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal__head">
      <span class="obj-av" id="modal-av"></span>
      <span class="modal__title" id="modal-title">Name your app</span>
    </div>
    <div class="modal__body">
      <div class="field">
        <label class="field__label" for="app-name">App name</label>
        <input class="input" id="app-name" placeholder="e.g. Northline" autocomplete="off">
        <span class="field__hint">This is what people see in the sidebar and the app switcher.</span>
      </div>
      <div class="field">
        <span class="field__label">Icon</span>
        <div class="glyphs" id="glyphs"></div>
      </div>
      <div class="field">
        <span class="field__label">Color</span>
        <div class="swatches" id="swatches"></div>
      </div>
    </div>
    <div class="modal__foot">
      <button class="btn btn--subtle" id="modal-cancel">Cancel</button>
      <button class="btn btn--primary" id="modal-create" disabled>Create app</button>
    </div>
  </div>
</div>

<!-- Typeahead -->
<div class="ta" id="ta">
  <div class="ta__inputwrap">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6 14 14"/></svg>
    <input class="ta__input" id="ta-input" placeholder="Search projects, tables, portfolios…" autocomplete="off">
  </div>
  <div class="ta__list" id="ta-list"></div>
  <div class="ta__foot">
    <span class="kbd">↑</span><span class="kbd">↓</span> to navigate
    <span class="kbd">↵</span> to add
    <span class="kbd">esc</span> to close
  </div>
</div>

<div class="toast" id="toast"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 5"/></svg><span id="toast-msg"></span></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   ICONS — the rail/sidebar glyphs are real Figma exports (filled paths,
   fill="currentColor"). Object-type glyphs are drawn in the same FILLED
   idiom rather than strokes, so they sit consistently beside the real ones.
   ═══════════════════════════════════════════════════════════════════════ */

/* ── helpers ─────────────────────────────────────────────────────────── */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cz = (name, part) => `var(--cz-${name}-${part})`;

function avatarHtml(glyph, color, size) {
  const cls = size === 'sm' ? ' obj-av--sm' : size === 'lg' ? ' obj-av--lg' : '';
  const box = size === 'sm' ? 'ico--12' : 'ico--16';
  return `<span class="obj-av${cls}" style="background:${cz(color,'bg')};color:${cz(color,'fg')}">
    <span class="ico ${box}" style="color:inherit">${IC[glyph] || IC.portfolio}</span></span>`;
}
function typeAvatar(type, size) {
  const t = TYPES[type];
  const cls = size === 'sm' ? ' obj-av--sm' : '';
  const box = size === 'sm' ? 'ico--12' : 'ico--16';
  return `<span class="obj-av${cls}" style="background:${t.bg};color:${t.fg}">
    <span class="ico ${box}" style="color:inherit">${IC[t.icon]}</span></span>`;
}

let toastT = null;
function toast(msg) {
  $('#toast-msg').textContent = msg;
  $('#toast').classList.add('toast--on');
  clearTimeout(toastT);
  toastT = setTimeout(() => $('#toast').classList.remove('toast--on'), 2600);
}

const STEP_LABELS = { workspace:'Workspace', apps:'Apps', builder:'Build', app:'End user' };
function renderSteps() {
  const idx = SCREENS.indexOf(S.screen);
  $('#steps').innerHTML = SCREENS.map((s, i) => {
    const cls = s === S.screen ? 'proto-step--active' : (i < idx ? 'proto-step--done' : '');
    // Only let the reviewer jump back to a screen the flow has reached
    const reachable = i <= idx || (s === 'app' && S.published);
    return `<button class="proto-step ${cls}" data-step="${s}" ${reachable ? '' : 'disabled'}>
      <span class="proto-step__n">${i + 1}</span>${STEP_LABELS[s]}</button>` +
      (i < SCREENS.length - 1 ? '<span class="proto-nav__sep">›</span>' : '');
  }).join('');
}

/* `opts.appEntry` adds the published app above the Build tool.
   `opts.nudge` pulses the Build entry so reviewers find it. */
function railHtml(opts) {
  opts = opts || {};
  const modes = RAIL_MODES.map(m => `
    <button class="rail__mode ${S.railMode === m.key && !opts.appActive ? 'rail__mode--active' : ''}" data-rail="${m.key}">
      <span class="rail__mode-icon">${IC[m.icon]}</span>
      <span class="rail__mode-label">${m.label}</span>

  const appEntry = opts.appEntry ? `

      </span>
      <span class="rail__mode-label">${esc(CFG.name.split(' ')[0])}</span>

        <span class="rail__mode-label">Build</span>

/* ═══════════════════════════════════════════════════════════════════════
   TYPEAHEAD
   ═══════════════════════════════════════════════════════════════════════ */
let taSi = null, taCursor = 0, taResults = [];
function openTA(si, anchor) {
  taSi = si; taCursor = 0;
  $('#ta-input').value = '';
  paintTA();
  const ta = $('#ta');
  ta.classList.add('ta--on');
  const r = anchor.getBoundingClientRect();
  // Keep the popover on-screen
  const top = Math.min(r.bottom + 6, window.innerHeight - ta.offsetHeight - 12);
  const left = Math.min(r.left, window.innerWidth - 340);
  ta.style.top = Math.max(12, top) + 'px';
  ta.style.left = Math.max(12, left) + 'px';
  setTimeout(() => $('#ta-input').focus(), 20);
}
function closeTA() { $('#ta').classList.remove('ta--on'); taSi = null; }

const usedIds = () => CFG.sections.flatMap(s => s.items);

function paintTA() {
  const q = $('#ta-input').value.trim().toLowerCase();
  const used = usedIds();
  taResults = CATALOG
    .filter(o => !q || o.name.toLowerCase().includes(q) || TYPES[o.type].label.toLowerCase().includes(q))
    .sort((a, b) => {
      if (!q) return 0;
      // Prefix matches first — feels like Asana's picker
      const ap = a.name.toLowerCase().startsWith(q) ? 0 : 1;
      const bp = b.name.toLowerCase().startsWith(q) ? 0 : 1;
      return ap - bp;
    });
  if (taCursor >= taResults.length) taCursor = Math.max(0, taResults.length - 1);

  if (!taResults.length) {
    $('#ta-list').innerHTML = `<div class="ta__empty">No objects match “${esc(q)}”.</div>`;
    return;
  }
  // group by type, preserving TYPES order
  const order = Object.keys(TYPES);
  const groups = order.map(t => [t, taResults.filter(o => o.type === t)]).filter(([, v]) => v.length);
  let n = -1;
  $('#ta-list').innerHTML = groups.map(([t, items]) => `
    <div class="ta__group">${TYPES[t].label}s</div>
    ${items.map(o => {
      n++;
      const isUsed = used.includes(o.id);
      return `<div class="ta__opt ${n === taCursor ? 'ta__opt--cursor' : ''} ${isUsed ? 'ta__opt--dis' : ''}"
                   data-pick="${o.id}" data-n="${n}">
        ${typeAvatar(o.type, 'sm')}
        <span class="ta__opt-body">
          <div class="ta__opt-name">${mark(o.name, q)}</div>
          <div class="ta__opt-meta">${esc(o.meta)}</div>
        </span>
        ${isUsed ? '<span class="ta__opt-added">Added</span>' : ''}
      </div>`;
    }).join('')}`).join('');
}
function mark(name, q) {
  if (!q) return esc(name);
  const i = name.toLowerCase().indexOf(q);
  if (i < 0) return esc(name);
  return esc(name.slice(0, i)) + '<span class="hl">' + esc(name.slice(i, i + q.length)) + '</span>' + esc(name.slice(i + q.length));
}
function pick(id) {
  if (taSi == null) return;
  const sec = CFG.sections[taSi];
  if (sec.items.includes(id)) { toast(`${byId(id).name} is already in this app`); return; }
  sec.items.push(id);
  S.sel = id;
  closeTA();
  paintBuilder();
  toast(`Added ${byId(id).name}`);
}

  ['Sunset Commons','Los Angeles, CA',42,'Takeover','52%'],
  ['Riverview Lofts','Portland, OR',98,'Stabilized','94%'],
  ['Cedar Park Flats','Denver, CO',120,'New Development','0%'],
  ['Northgate Place','Austin, TX',68,'New Development','74%'],
];
const STATUS_COLOR = {
  'Takeover':'yellow', 'Stabilized':'green', 'New Development':'blue-green',
  'Renovation':'indigo', 'Separation':'pink', 'On track':'green', 'At risk':'orange',
};
function statusPill(s) {
  const c = STATUS_COLOR[s] || 'none';
  return `<span class="status" style="background:${cz(c,'bg')};color:${cz(c,'fg')}">${esc(s)}</span>`;
}

function objectHtml(o, isPreview) {
  const head = `
    <div class="cv__head">
      <div class="cv__title-row">
        ${typeAvatar(o.type)}
        <span class="cv__title">${esc(o.name)}</span>
      </div>
      <span class="cv__sub">${TYPES[o.type].label} · ${esc(o.meta)}</span>
    </div>`;
  return head + `<div class="cv__body">${bodyFor(o)}</div>`;
}

function bodyFor(o) {
  switch (o.type) {
    case 'table': {
      const rows = o.id === 'tb-prop' ? PROPS : PROPS.slice(0, 4);
      return `<div class="grid-wrap"><table class="grid">
        <thead><tr><th>Name</th><th>Location</th><th>Units</th><th>Status</th><th>Occupancy</th></tr></thead>
        <tbody>${rows.map(r => `<tr>
          <td>${esc(r[0])}</td><td>${esc(r[1])}</td><td class="num">${r[2]}</td>
          <td>${statusPill(r[3])}</td><td class="num">${r[4]}</td></tr>`).join('')}</tbody>
      </table></div>`;
    }
    case 'dashboard':
      return `<div class="metrics">
        ${[['Active work','27','+4 this week','up'],
           ['Open tasks','505','of 723','' ],
           ['Vendors','86','12 pending','' ],
           ['Overdue','9','−3 vs last week','up']]
          .map(([l,v,d,dir]) => `<div class="metric">
            <span class="metric__label">${l}</span>
            <span class="metric__value">${v}</span>
            <span class="metric__delta ${dir}">${d}</span></div>`).join('')}
      </div>`;
    case 'portfolio':
      return `<div class="grid-wrap"><table class="grid">
        <thead><tr><th>Project</th><th>Owner</th><th>Status</th><th>Progress</th><th>Due</th></tr></thead>
        <tbody>${[['Marlow Renovation','James Wu','Takeover','68%','Nov 14'],
                   ['Beacon Hill Takeover','Sarah Chen','Stabilized','96%','Sep 30'],
                   ['Sunset Commons Lease-Up','James Wu','Takeover','52%','Dec 1'],
                   ['Vendor Onboarding','Priya Patel','On track','41%','ongoing']]
          .map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${statusPill(r[2])}</td>
            <td class="num">${r[3]}</td><td>${r[4]}</td></tr>`).join('')}</tbody>
      </table></div>`;
    case 'project':
      return `<div class="tasklist">
        ${[['Final walkthrough — units 1–12','Aug 22','done'],
           ['Punch list sign-off','Aug 25',''],
           ['Vendor invoices reconciled','Aug 28',''],
           ['Resident move-in packets','Sep 2',''],
           ['Update occupancy forecast','Sep 5','']]
          .map(([n,d,st]) => `<div class="task ${st === 'done' ? 'task--done' : ''}">
            <span class="check"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 8.4l3 3 5.8-6"/></svg></span>
            <span class="task__name">${esc(n)}</span><span class="task__meta">${d}</span></div>`).join('')}
      </div>`;
    case 'page':
      return `<div class="doc">
        <h4>Purpose</h4>
        <p>How the operations team takes a property from acquisition through
        stabilization, and who owns each stage.</p>
        <h4>Stages</h4>
        <ul><li>Due diligence &amp; handover</li><li>Staffing and vendor setup</li>
        <li>Unit turns and capital work</li><li>Lease-up and stabilization</li></ul>
        <h4>Escalation</h4>
        <p>Anything that puts the stabilization date at risk goes to the regional
        manager same-day, and onto the Leadership Digest that week.</p>
      </div>`;
    case 'team':
      return `<div class="people-grid">
        ${[['James Wu','Regional Manager','blue'],['Sarah Chen','Ops Lead','pink'],
           ['Marcus Reid','Facilities','indigo'],['Priya Patel','Vendor Manager','orange'],
           ['Dana Ruiz','Analyst','aqua'],['Sam Cole','Compliance','green']]
          .map(([n,r,c]) => `<div class="person">
            <span class="avatar" style="background:${cz(c,'bg')};color:${cz(c,'fg')}">${n.split(' ').map(x=>x[0]).join('')}</span>
            <span><div class="person__name">${esc(n)}</div><div class="person__role">${esc(r)}</div></span>
          </div>`).join('')}
      </div>`;
    case 'goal':
      return `<div class="metrics" style="margin-bottom:16px">
        <div class="metric"><span class="metric__label">Target</span><span class="metric__value">95%</span><span class="metric__delta">portfolio occupancy</span></div>
        <div class="metric"><span class="metric__label">Current</span><span class="metric__value">91.4%</span><span class="metric__delta up">+1.2 this quarter</span></div>
        <div class="metric"><span class="metric__label">Status</span><span class="metric__value" style="font-size:16px;line-height:32px">${o.meta.includes('risk') ? 'At risk' : 'On track'}</span><span class="metric__delta">updated 2d ago</span></div>
      </div>
      <div class="doc"><h4>Contributing work</h4>
      <p>4 projects and 2 portfolios roll up into this goal.</p></div>`;
    default:
      return '<div class="empty"><span class="empty__title">Nothing to show</span></div>';
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   SCREEN 4 — END-USER APP
   ═══════════════════════════════════════════════════════════════════════ */
function renderEndUser() {
  $('#rail').innerHTML = railHtml({ appEntry: true, appActive: true });

  const secs = CFG.sections.map(sec => `
    <div class="sb__section">${esc(sec.name)}</div>
    <div class="sb__group">
      ${sec.items.map(id => {
        const o = byId(id);
        return `<div class="sb__row ${S.sel === id ? 'sb__row--active' : ''}" data-open="${id}">
          ${typeAvatar(o.type, 'sm')}
          <span class="sb__row-label">${esc(o.name)}</span>
        </div>`;
      }).join('')}
    </div>`).join('');

  $('#sidebar').innerHTML = `<div class="sb__section" style="height:36px;align-items:center">
      ${avatarHtml(CFG.glyph, CFG.color, 'sm')}
      <span style="margin-left:8px;color:var(--text);font-size:var(--type-m-size);font-weight:500">${esc(CFG.name)}</span>
    </div>${secs}`;

  const first = CFG.sections[0] && CFG.sections[0].items[0];
  if (!S.sel) S.sel = first || null;

  $('#canvas').innerHTML = S.sel ? objectHtml(byId(S.sel)) : `
    <div class="empty"><span class="empty__art">${IC.build}</span>
    <span class="empty__title">This app is empty</span></div>`;
}

/* ═══════════════════════════════════════════════════════════════════════
   ROUTER
   ═══════════════════════════════════════════════════════════════════════ */
function go(screen) {
  S.screen = screen;
  if (screen !== 'builder') $('#builder').classList.remove('builder--on');
  if (screen === 'workspace') { S.railMode = 'work'; renderWorkspace(); }
  if (screen === 'apps')      renderApps();
  if (screen === 'builder')   { $('#builder').classList.add('builder--on'); paintBuilder(); }
  if (screen === 'app')       renderEndUser();
  renderSteps();
}

/* ═══════════════════════════════════════════════════════════════════════
   EVENTS — delegated, so every re-render keeps working
   ═══════════════════════════════════════════════════════════════════════ */
document.addEventListener('click', (e) => {
  const t = e.target;

  // prototype step trail
  const step = t.closest('[data-step]');
  if (step && !step.disabled) { go(step.dataset.step); return; }

  // rail
  const rail = t.closest('[data-rail]');
  if (rail) {
    const k = rail.dataset.rail;
    if (k === 'build') { go('apps'); return; }
    if (k === 'app')   { if (S.published) { S.sel = null; go('app'); } return; }
    S.railMode = k;
    if (S.screen !== 'workspace') go('workspace'); else renderWorkspace();
    return;
  }

  // apps index
  if (t.closest('#new-app') || t.closest('#new-app-card')) { openModal(); return; }
  if (t.closest('[data-open-app]')) { S.sel = null; go('app'); return; }

  // modal
  if (t.closest('[data-glyph]')) { CFG.glyph = t.closest('[data-glyph]').dataset.glyph; paintModal(); return; }
  if (t.closest('[data-color]')) { CFG.color = t.closest('[data-color]').dataset.color; paintModal(); return; }
  if (t.closest('#modal-cancel')) { $('#scrim').classList.remove('scrim--on'); return; }
  if (t.closest('#modal-create')) {
    CFG.name = $('#app-name').value.trim() || 'Untitled app';
    $('#scrim').classList.remove('scrim--on');
    openBuilder();
    return;
  }

  // builder tabs
  const bt = t.closest('[data-bt]');
  if (bt) { S.bldTab = bt.dataset.bt; paintBuilder(); return; }

  // sections
  if (t.closest('#add-section')) {
    CFG.sections.push({ name: `Section ${CFG.sections.length + 1}`, items: [] });
    paintBuilder();
    // focus the new section's name so it can be renamed immediately
    const inputs = $$('[data-secname]');
    const last = inputs[inputs.length - 1];
    if (last) { last.focus(); last.select(); }
    return;
  }
  const delsec = t.closest('[data-delsec]');
  if (delsec) {
    const si = +delsec.dataset.delsec;
    const removed = CFG.sections.splice(si, 1)[0];
    if (removed && removed.items.includes(S.sel)) S.sel = null;
    paintBuilder();
    return;
  }
  const addobj = t.closest('[data-addobj]');
  if (addobj) { openTA(+addobj.dataset.addobj, addobj); return; }
  const delobj = t.closest('[data-delobj]');
  if (delobj) {
    const [si, ii] = delobj.dataset.delobj.split(':').map(Number);
    const gone = CFG.sections[si].items.splice(ii, 1)[0];
    if (S.sel === gone) S.sel = null;
    paintBuilder();
    return;
  }
  // select an object (preview + end user)
  const item = t.closest('[data-obj]');
  if (item) { S.sel = item.dataset.obj; renderPreview(); return; }
  const open = t.closest('[data-open]');
  if (open) { S.sel = open.dataset.open; renderEndUser(); return; }

  // typeahead pick
  const p = t.closest('[data-pick]');
  if (p) { if (!p.classList.contains('ta__opt--dis')) pick(p.dataset.pick); return; }

  // settings
  const gen = t.closest('[data-gen]');
  if (gen) { CFG.access.general = gen.dataset.gen; renderSettings(); return; }

  // builder actions
  if (t.closest('#bld-cancel')) {
    $('#builder').classList.remove('builder--on');
    go(S.published ? 'apps' : 'apps');
    return;
  }
  if (t.closest('#bld-publish')) {
    S.published = true;
    $('#builder').classList.remove('builder--on');
    S.sel = null;
    go('app');
    toast(`${CFG.name} published`);
    return;
  }

  if (t.closest('#reset')) { hardReset(); return; }

  // click-away closes the typeahead
  if (!t.closest('#ta')) closeTA();
});

/* section rename */
document.addEventListener('input', (e) => {
  const sn = e.target.closest('[data-secname]');
  if (sn) { CFG.sections[+sn.dataset.secname].name = sn.value; return; }
  if (e.target.id === 'app-name') { $('#modal-create').disabled = !e.target.value.trim(); return; }
  if (e.target.id === 'ta-input') { taCursor = 0; paintTA(); return; }
});
document.addEventListener('change', (e) => {
  const perm = e.target.closest('[data-perm]');
  if (perm) {
    const i = +perm.dataset.perm;
    if (perm.value === 'Remove') {
      const gone = CFG.access.people.splice(i, 1)[0];
      renderSettings();
      toast(`Removed ${gone.name} as an editor`);
    } else {
      CFG.access.people[i].perm = perm.value;
    }
    return;
  }
});

/* keyboard */
document.addEventListener('keydown', (e) => {
  // modal
  if ($('#scrim').classList.contains('scrim--on')) {
    if (e.key === 'Escape') $('#scrim').classList.remove('scrim--on');
    if (e.key === 'Enter' && $('#app-name').value.trim()) $('#modal-create').click();
    return;
  }
  // typeahead
  if ($('#ta').classList.contains('ta--on')) {
    if (e.key === 'Escape') { e.preventDefault(); closeTA(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); taCursor = Math.min(taCursor + 1, taResults.length - 1); paintTA(); scrollCursor(); return; }
    if (e.key === 'ArrowUp')   { e.preventDefault(); taCursor = Math.max(taCursor - 1, 0); paintTA(); scrollCursor(); return; }
    if (e.key === 'Enter') {
      e.preventDefault();
      const o = taResults[taCursor];
      if (o && !usedIds().includes(o.id)) pick(o.id);
      return;
    }
  }
  // blur a section name on Enter
  if (e.key === 'Enter' && e.target.closest('[data-secname]')) { e.target.blur(); }
});
function scrollCursor() {
  const el = $('.ta__opt--cursor');
  if (el) el.scrollIntoView({ block: 'nearest' });
}

/* ── drag to reorder objects within / across sections ────────────────── */
let dragFrom = null;
document.addEventListener('dragstart', (e) => {
  const it = e.target.closest('.sec__item');
  if (!it) return;
  dragFrom = { si: +it.dataset.si, ii: +it.dataset.ii };
  it.classList.add('sec__item--drag');
  e.dataTransfer.effectAllowed = 'move';
  // Firefox needs data set for the drag to start
  e.dataTransfer.setData('text/plain', it.dataset.obj);
});
document.addEventListener('dragend', () => {
  $$('.sec__item--drag').forEach(n => n.classList.remove('sec__item--drag'));
  $$('.sec__item--over').forEach(n => n.classList.remove('sec__item--over'));
});
document.addEventListener('dragover', (e) => {
  const it = e.target.closest('.sec__item');
  const items = e.target.closest('[data-items]');
  if (!it && !items) return;
  e.preventDefault();
  $$('.sec__item--over').forEach(n => n.classList.remove('sec__item--over'));
  if (it) it.classList.add('sec__item--over');
});
document.addEventListener('drop', (e) => {
  if (!dragFrom) return;
  const it = e.target.closest('.sec__item');
  const zone = e.target.closest('[data-items]');
  if (!it && !zone) return;
  e.preventDefault();

  const toSi = it ? +it.dataset.si : +zone.dataset.items;
  const toIi = it ? +it.dataset.ii : CFG.sections[toSi].items.length;
  const moved = CFG.sections[dragFrom.si].items.splice(dragFrom.ii, 1)[0];
  // account for the removal shifting indices within the same section
  const adj = (dragFrom.si === toSi && dragFrom.ii < toIi) ? toIi - 1 : toIi;
  CFG.sections[toSi].items.splice(adj, 0, moved);
  dragFrom = null;
  paintBuilder();
});

/* ═══════════════════════════════════════════════════════════════════════
   RESET
   ═══════════════════════════════════════════════════════════════════════ */
function hardReset() {
  S = { screen:'workspace', railMode:'work', published:false, sel:null, bldTab:'build' };
  CFG = freshCfg();
  closeTA();
  $('#scrim').classList.remove('scrim--on');
  $('#builder').classList.remove('builder--on');
  go('workspace');
}

/* boot */
CFG = freshCfg();
go('workspace');
</script>
</body>
